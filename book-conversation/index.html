<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Conversatiohhn</title>

    <!-- <script
      src="https://kit.fontawesome.com/3df60fe6e2.js"
      crossorigin="anonymous"
    ></script> -->
  </head>
  <link rel="stylesheet" href="./main.css" />
  <body>
    <section class="book-conversation-section">
      <div class="box-container">
        <div class="intro-container">
          <div class="left-content">
            <h3>Let’s help you unlock growth clarity for your business.</h3>

            <div class="info">
              <img
                src="../img/left-conv-pattern.png"
                class="content-pattern"
                alt=""
              />
              <div class="info-content">
                <div class="btn">
                  <a href="./form.html"
                    >Let’s get started
                    <div>
                      <img src="../img/right.png" alt="" />
                    </div>
                  </a>
                </div>
                <div class="para">
                  <p>
                    <span>The consultation</span> will analyze your challenges,
                    identify growth blockers, and design a roadmap to help you
                    scale sustainably in African markets.
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="right-content">
            <img
              class="mobile"
              src="../img/mobile-main-bg.png"
              loading="lazy"
              alt=""
            />
            <div class="desktop-image-cont">
              <img
                class="desktop"
                loading="lazy"
                src="../img/right-desktop-bg.png"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
