<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultation</title>

    <link rel="stylesheet" href="./payment.css" />

    <script
      src="https://kit.fontawesome.com/3df60fe6e2.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="payment-main-container">
      <div class="payment-container">
        <div class="payment-box-content">
          <div class="success-icon-container">
            <div class="success-icon">
              <i class="fa-solid fa-check"></i>
            </div>
          </div>

          <h1 class="payment-status">Payment Successful!</h1>

          <div class="payment-card">
            <p class="card-title">P23 Africa Consultation</p>
            <div class="amount-date-time">
              <span class="amount">$320.1</span>
              <div class="date-time">
                <span class="date">Mar 22, 2023</span>
                <span class="time">10:40AM</span>
              </div>
            </div>
            <div class="details-row">
              <div class="detail-item">
                <span class="label">Reference Number</span>
                <span class="value">000865782257</span>
              </div>
              <div class="divider"></div>

              <div class="detail-item">
                <span class="label">Payment Method</span>
                <span class="value">Credit Card</span>
              </div>
            </div>
          </div>

          <p class="thank-you-message">
            Thank you for booking your consultation with us.
          </p>

          <a href="./schedule.html" class="proceed-button">
            Proceed to scheduling your session
          </a>
        </div>
      </div>
    </section>

    <script src="./consult.js"></script>
  </body>
</html>
